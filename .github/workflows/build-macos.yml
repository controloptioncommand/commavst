name: Build macOS

on:
  push:
    branches: [ main, 'claude/**' ]   # ветки — только сборка и архив в Artifacts, релиз — только из main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# новая сборка отменяет незаконченную предыдущую, чтобы релиз не перезаписала старая
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS-раннеры GitHub временами не выдаются: сборка идёт сразу на трёх типах, релиз — из первой удачной.
    # Плагин везде универсальный (arm64 + x86_64); тест и валидаторы проверяют родную часть раннера.
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15, macos-14, macos-15-intel ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # вся история и теги — для проверки приватности и релизов

      # Ничего личного в публичный репозиторий: почты, ключи, ссылки на переписку с ИИ
      - name: Privacy check
        run: bash scripts/privacy-check.sh

      # У каждой версии должен быть патчноут: docs/releases/<VERSION>.md
      - name: Release notes check
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -s "docs/releases/$VERSION.md" || { echo "::error::Нет патчноута docs/releases/$VERSION.md"; exit 1; }

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/juce-src
            build/_deps/clap_juce_extensions-src
            build/_deps/tuning_library-src
            build/_deps/mts_esp-src
          key: deps-juce-8.0.10-cje-6bde108-tl-d6fcc08-mts-f214739-${{ matrix.runner }}-${{ github.repository }}

      - name: Configure
        run: cmake -B build -G Xcode -DCOMMA_BUILD_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build plugin (VST3 + AU + CLAP)
        run: cmake --build build --config Release --target Comma_VST3 Comma_AU Comma_CLAP -- -quiet

      - name: Build and run test
        run: |
          cmake --build build --config Release --target CommaTest -- -quiet
          ./build/CommaTest_artefacts/Release/CommaTest "$RUNNER_TEMP/render"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - build/Comma_artefacts/Release/VST3/Comma.vst3
          codesign --force --deep -s - build/Comma_artefacts/Release/AU/Comma.component
          codesign --force --deep -s - build/Comma_artefacts/Release/CLAP/Comma.clap

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --timeout-ms 600000 build/Comma_artefacts/Release/VST3/Comma.vst3

      # Music Effect (aumf): эффект, которому Logic отправляет MIDI
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Comma_artefacts/Release/AU/Comma.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Cmma Prsn

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Comma_artefacts/Release/VST3/Comma.vst3 dist/
          cp -R build/Comma_artefacts/Release/AU/Comma.component dist/
          cp -R build/Comma_artefacts/Release/CLAP/Comma.clap dist/
          cp scripts/install-mac.sh dist/
          if [ -f docs/Comma-manual.pdf ]; then cp docs/Comma-manual.pdf dist/; fi
          cd dist && zip -qry ../Comma-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Comma-macOS-${{ matrix.runner }}
          path: Comma-macOS.zip

  # Текущая версия: архив + патчноут. Постоянная ссылка:
  # https://github.com/controloptioncommand/commavst/releases/latest/download/Comma-macOS.zip
  publish:
    needs: build
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Comma-macOS-*
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # архив из первой удачной сборки: Apple Silicon, потом остальные
          ZIP=""
          for r in macos-15 macos-14 macos-15-intel; do
            if [ -f "artifacts/Comma-macOS-$r/Comma-macOS.zip" ]; then ZIP="artifacts/Comma-macOS-$r/Comma-macOS.zip"; echo "Архив со сборки $r"; break; fi
          done
          [ -n "$ZIP" ] || { echo "::error::Ни одна сборка не прошла"; exit 1; }
          cp "$ZIP" Comma-macOS.zip
          # имя релиза — из файла VERSION; повторная сборка той же версии обновляет релиз
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release delete "$VERSION" --cleanup-tag -y || true
          gh release create "$VERSION" Comma-macOS.zip \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --latest
